    <p class="note" id="verNote"></p>
    <p class="note">교육용 앱이에요. 특정 종목 추천이나 투자 권유가 아니며, 세법·거래 제도는 바뀔 수 있어요. 글꼴: Pretendard (OFL)</p>
  </div>
</div>
